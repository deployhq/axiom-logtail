name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.7 is the oldest consumer and is NOT optional -- a change that only
        # works on 3.x breaks that app at boot. 3.4 is the newest.
        ruby: ["2.7", "3.2", "3.4"]
    name: rspec (ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
